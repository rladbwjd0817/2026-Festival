<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제5회 뜰안애 Festival · 예약 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fbf4e2; --cream2:#fff9ee; --ink:#49351f; --muted:#9c8a6c; --line:#e6d6b0;
    --gold:#c6a052; --gold-d:#a67f35; --gold-l:#ecd38f; --velvet:#9a2f2c; --velvet-d:#6e1f1f;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",'Apple SD Gothic Neo',sans-serif; color:var(--ink);
    background:#241510; background-image:radial-gradient(85% 45% at 50% -4%, rgba(255,214,140,.2), rgba(255,214,140,0) 60%), linear-gradient(180deg,#3c251c,#1b100c 70%); background-attachment:fixed; min-height:100vh;}
  .valance{height:24px; background:linear-gradient(180deg,#a8322f,#7a2222); position:relative}
  .valance::before{content:""; position:absolute; left:0; right:0; top:22px; height:2px; background:linear-gradient(90deg,#a67f35,#ecd38f,#a67f35)}
  .valance::after{content:""; position:absolute; left:0; right:0; top:24px; height:13px; background:radial-gradient(circle at 11px -3px,#7a2222 11px,transparent 12px) repeat-x; background-size:22px 13px}
  header{text-align:center; padding:20px 16px 12px}
  header .t{font-family:"Noto Serif KR",serif; font-weight:900; font-size:21px;
    background:linear-gradient(180deg,#f8e7ac,#dcb75a 55%,#a9801f); -webkit-background-clip:text; background-clip:text; color:transparent}
  header .s{font-size:12px; color:#e0cfa8; opacity:.8; margin-top:3px}
  .wrap{max-width:920px; margin:0 auto; padding:16px}

  .login{max-width:340px; margin:40px auto; background:var(--cream2); border:1.5px solid var(--gold); border-radius:16px; padding:24px; text-align:center; box-shadow:0 14px 36px rgba(0,0,0,.35)}
  .login h2{margin:0 0 6px; font-size:17px; color:var(--velvet); font-family:"Noto Serif KR",serif} .login p{font-size:12.5px; color:var(--muted); margin:0 0 16px}
  .login input{width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:16px; text-align:center; letter-spacing:2px}
  .login button{margin-top:12px; width:100%; padding:12px; border:1px solid var(--gold-d); border-radius:11px; background:linear-gradient(180deg,var(--velvet),var(--velvet-d)); color:#fff; font-size:15px; font-weight:800}
  .err{color:#c0392b; font-size:12.5px; margin-top:10px; min-height:16px}

  .section-title{color:var(--gold-l); font-size:13px; font-weight:800; margin:18px 2px 8px; font-family:"Noto Serif KR",serif}
  .stats{display:flex; gap:8px; flex-wrap:wrap}
  .stat{flex:1; min-width:100px; background:var(--cream); border:1px solid var(--gold); border-radius:12px; padding:10px 14px; font-size:13px; text-align:center}
  .stat b{font-size:22px; color:var(--velvet); display:block; font-family:"Noto Serif KR",serif}
  .stat .u{font-size:11px; color:var(--muted)}

  .classstats{display:flex; gap:8px; flex-wrap:wrap}
  .cscard{background:var(--cream); border:1px solid var(--gold); border-radius:12px; padding:9px 12px; font-size:12px; cursor:pointer; text-align:center; min-width:92px}
  .cscard .cn{font-weight:700}
  .cscard b{display:block; font-size:16px; color:var(--velvet); margin-top:2px}
  .cscard .sub{font-size:10.5px; color:var(--muted)}
  .cscard.on{background:linear-gradient(180deg,var(--velvet),var(--velvet-d)); border-color:var(--velvet-d)}
  .cscard.on .cn, .cscard.on b, .cscard.on .sub{color:#fff}

  .bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin:14px 0 10px}
  .ctrls{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .ctrls select{padding:9px 11px; border:1px solid var(--gold); border-radius:9px; background:var(--cream); font-size:13px; font-weight:600; color:var(--ink)}
  .tools{display:flex; gap:6px; flex-wrap:wrap}
  .tools button{border:1px solid var(--gold); background:var(--cream); border-radius:9px; padding:9px 12px; font-size:13px; font-weight:700; color:var(--ink)}
  .tools button.excel{background:linear-gradient(180deg,#2f7a43,#246034); color:#fff; border-color:#1e5029}

  .tbl{background:var(--cream2); border:1.5px solid var(--gold); border-radius:14px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.3)}
  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th,td{padding:11px 12px; text-align:left; border-bottom:1px solid #efe4cb}
  th{background:#f3ead4; font-size:12px; color:#7a6b4e; font-weight:700}
  tr:last-child td{border-bottom:0}
  .seats{color:var(--velvet); font-weight:700}
  .cnt{white-space:nowrap; color:var(--muted); font-size:13px}
  .cnt b{color:var(--velvet); font-size:15px}
  .pk{text-align:center; width:40px}
  .pk input{width:18px; height:18px; accent-color:var(--velvet); cursor:pointer}
  .bulkdel{border:1px solid #d98a8a; background:#fdeeee; color:#b23b3b; font-weight:700}
  .bulkdel:not(:disabled){background:#f6dede}
  .bulkdel:disabled{opacity:.45; cursor:default}
  .delbtn{border:1px solid #e0b9ac; background:#f7e9e3; color:var(--velvet); border-radius:8px; padding:5px 10px; font-size:12px; font-weight:700}
  .empty{text-align:center; color:var(--muted); padding:40px 16px; font-size:14px}
  .cls-head{background:#f0e4c6; font-weight:800; font-size:13px; color:var(--ink)}

  .unbooked{display:flex; flex-direction:column; gap:7px}
  .ubrow{background:var(--cream); border:1px solid var(--gold); border-radius:12px; padding:9px 13px; font-size:13px}
  .ubrow .uc{font-weight:800; color:var(--ink); font-size:14px}
  .ubrow .uct{font-size:11.5px; color:var(--muted); margin-left:7px}
  .ubrow .names{margin-top:4px; color:var(--velvet); font-weight:700; line-height:1.65}
  .ubrow.done{opacity:.72}
  .ubrow.done .names{color:#2f7a43}
  .ubhint{color:var(--muted); font-size:12.5px; padding:6px 2px}
  @media print{ body{background:#fff} .valance,.bar,.tools,.ctrls,header .s,.delbtn,.pk{display:none} .tbl{border:0; box-shadow:none} header .t{color:#000 !important; -webkit-text-fill-color:#000} .cscard{border-color:#999} }
</style>
</head>
<body>
<div class="valance"></div>
<header>
  <div class="t">제5회 뜰안애 FESTIVAL · 예약 관리자</div>
  <div class="s">2026. 12. 11. (금) 오후 6시 · 북구문화예술회관</div>
</header>

<div class="wrap">
  <div class="login" id="login">
    <h2>🔒 관리자 확인</h2>
    <p>관리자 비밀번호를 입력하세요.</p>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="off">
    <button id="loginBtn">확인</button>
    <div class="err" id="err"></div>
  </div>

  <div id="dash" style="display:none">
    <div class="section-title">📊 전체 현황</div>
    <div class="stats">
      <div class="stat"><b id="stFam">0</b><span class="u">예약 가정</span></div>
      <div class="stat"><b id="stSeat">0</b><span class="u">예약 좌석</span></div>
      <div class="stat"><b id="stRate">0%</b><span class="u" id="stRateU">예약률 (/450석)</span></div>
    </div>

    <div class="section-title">🏷️ 반별 현황 <span style="font-weight:400;opacity:.7">(클릭하면 해당 반만 보기)</span></div>
    <div class="classstats" id="classStats"></div>

    <div class="section-title">🔔 아직 예약 안 한 아이 <span style="font-weight:400;opacity:.7">(명단 대조 · 독촉용)</span></div>
    <div class="unbooked" id="unbookedPanel"><div class="ubhint">명단을 불러오는 중…</div></div>

    <div class="bar">
      <div class="ctrls">
        <select id="classFilter"></select>
        <select id="sortMode">
          <option value="class">정렬: 반별</option>
          <option value="name">정렬: 이름 가나다순</option>
          <option value="time">정렬: 예약 시간순</option>
        </select>
      </div>
      <div class="tools">
        <button id="bulkDel" class="bulkdel" disabled>🗑️ 선택 삭제 (0)</button>
        <button id="refresh">🔄 새로고침</button>
        <button id="excel" class="excel">⬇️ 엑셀 다운로드</button>
        <button id="print">🖨️ 인쇄</button>
      </div>
    </div>
    <div class="tbl" id="tblWrap"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://whsptyyzqszsqchtsejy.supabase.co";
const SUPABASE_KEY = "sb_publishable_cI5aQY5Y_mG6DcIbAKoIkQ_NUbOpR7h";
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PW_KEY = "ddeuran_admin_pw";
const CLASSES = ["봄맞이반","사랑초반","설유화반","곰딸기반","해란초반","갯버들반","갯완두반"];
const TOTAL_SEATS = 450; // 일반 438 + 휠체어 12

let rows=[], pw="", sortMode="class", classFilter="", classStatus=[];

function fmtSeat(id){ const m=id.match(/^(.+)-(W?)(\d+)$/); return m ? m[1]+' '+(m[2]?'휠체어':'')+m[3] : id; }
function fmtTime(s){ const d=new Date(s); const p=n=>String(n).padStart(2,'0'); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function seatsOf(r){ return r.seats||[]; }

async function login(){
  const err=document.getElementById('err'); err.textContent='';
  const val=document.getElementById('pw').value.trim();
  if(!val){ err.textContent='비밀번호를 입력하세요.'; return; }
  const btn=document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='확인 중…';
  try{
    const { data, error } = await supa.rpc('admin_bookings',{ p_pw: val });
    if(error) throw error;
    if(!data.ok){ err.textContent=data.message||'비밀번호가 틀렸어요.'; return; }
    pw=val; try{ sessionStorage.setItem(PW_KEY, val); }catch(e){}
    rows=data.rows||[];
    document.getElementById('login').style.display='none';
    document.getElementById('dash').style.display='block';
    buildFilter(); render(); fetchClassStatus();
  }catch(e){ console.error(e); err.textContent='오류가 발생했어요. 다시 시도해주세요.'; }
  finally{ btn.disabled=false; btn.textContent='확인'; }
}
async function reload(){
  try{ const { data, error } = await supa.rpc('admin_bookings',{ p_pw: pw });
    if(error) throw error; if(data.ok){ rows=data.rows||[]; render(); } }catch(e){ console.error(e); }
  fetchClassStatus();
}

function statusOf(c){ return classStatus.find(s=>s.class===c); }
async function fetchClassStatus(){
  const el=document.getElementById('unbookedPanel');
  try{
    const { data, error } = await supa.rpc('admin_class_status',{ p_pw: pw });
    if(error) throw error;
    if(data && data.ok){ classStatus=data.classes||[]; render(); renderUnbooked(); }
    else if(el){ el.innerHTML='<div class="ubhint">명단 현황을 불러오지 못했어요.</div>'; }
  }catch(e){ console.error(e); if(el) el.innerHTML='<div class="ubhint">명단 현황을 불러오지 못했어요. (반별 현황 SQL을 먼저 실행했는지 확인해주세요)</div>'; }
}
function renderUnbooked(){
  const el=document.getElementById('unbookedPanel'); if(!el) return;
  if(!classStatus.length){ el.innerHTML='<div class="ubhint">명단이 비어있어요.</div>'; return; }
  const order=[...CLASSES, ...classStatus.map(s=>s.class).filter(c=>!CLASSES.includes(c))];
  let html='';
  order.forEach(c=>{
    const s=statusOf(c); if(!s) return;
    const un=s.unbooked||[]; const done=un.length===0;
    html+=`<div class="ubrow${done?' done':''}">`
      +`<span class="uc">${c}</span><span class="uct">예약 ${s.booked}/${s.enrolled}명</span>`
      +`<div class="names">${done?'✅ 전원 예약 완료':('아직 '+un.length+'명 · '+un.join(', '))}</div>`
      +`</div>`;
  });
  el.innerHTML=html||'<div class="ubhint">명단이 비어있어요.</div>';
}
async function cancelOne(group, name){
  if(!confirm(name+' 예약을 취소할까요? (좌석이 다시 풀려요)')) return;
  try{ const { data, error } = await supa.rpc('cancel_booking',{ p_group: group });
    if(error) throw error; rows=rows.filter(r=>r.group_id!==group); render();
  }catch(e){ console.error(e); alert('취소에 실패했어요.'); }
}

function buildFilter(){
  const sel=document.getElementById('classFilter');
  sel.innerHTML='<option value="">전체 반</option>'+CLASSES.map(c=>`<option value="${c}">${c}</option>`).join('');
  sel.value=classFilter;
}

function render(){
  // 전체 통계
  const famCount=rows.length;
  const seatCount=rows.reduce((n,r)=>n+seatsOf(r).length,0);
  document.getElementById('stFam').textContent=famCount;
  document.getElementById('stSeat').textContent=seatCount;
  document.getElementById('stRate').textContent=Math.round(seatCount/TOTAL_SEATS*100)+'%';
  document.getElementById('stRateU').textContent=`예약률 (${seatCount}/${TOTAL_SEATS}석)`;

  // 반별 통계
  const byClass={};
  CLASSES.forEach(c=>byClass[c]={fam:0,seat:0});
  rows.forEach(r=>{ const c=r.class; if(!byClass[c]) byClass[c]={fam:0,seat:0}; byClass[c].fam++; byClass[c].seat+=seatsOf(r).length; });
  const csWrap=document.getElementById('classStats'); csWrap.innerHTML='';
  const allCard=document.createElement('div'); allCard.className='cscard'+(classFilter===''?' on':'');
  allCard.innerHTML=`<div class="cn">전체</div><b>${famCount}</b><div class="sub">가정 · ${seatCount}석</div>`;
  allCard.onclick=()=>{ classFilter=''; document.getElementById('classFilter').value=''; render(); };
  csWrap.appendChild(allCard);
  Object.keys(byClass).forEach(c=>{
    const d=document.createElement('div'); d.className='cscard'+(classFilter===c?' on':'');
    const st=statusOf(c); const denom=st?`<span style="font-size:11px;opacity:.6">/${st.enrolled}</span>`:'';
    d.innerHTML=`<div class="cn">${c}</div><b>${byClass[c].fam}${denom}</b><div class="sub">가정 · ${byClass[c].seat}석</div>`;
    d.onclick=()=>{ classFilter=c; document.getElementById('classFilter').value=c; render(); };
    csWrap.appendChild(d);
  });

  // 목록 (필터 + 정렬)
  let list=classFilter? rows.filter(r=>r.class===classFilter) : rows.slice();
  const wrap=document.getElementById('tblWrap');
  if(list.length===0){ wrap.innerHTML='<div class="empty">예약 내역이 없어요.</div>'; return; }

  const rowHtml=(r)=>`<tr>
    <td class="pk"><input type="checkbox" class="pick" data-g="${r.group_id}"></td>
    <td>${r.class||''}</td><td><b>${r.name||''}</b></td>
    <td class="cnt"><b>${seatsOf(r).length}</b>석</td>
    <td class="seats">${seatsOf(r).map(fmtSeat).join(', ')}</td>
    <td>${fmtTime(r.at)}</td>
    <td><button class="delbtn" data-g="${r.group_id}" data-n="${(r.name||'').replace(/"/g,'')}">취소</button></td></tr>`;

  let html='<table><thead><tr><th class="pk"><input type="checkbox" id="checkAll" title="전체 선택"></th><th>반</th><th>아이 이름</th><th>좌석수</th><th>좌석</th><th>예약시각</th><th></th></tr></thead><tbody>';
  if(sortMode==='class' && !classFilter){
    const order=[...CLASSES, ...Object.keys(byClass).filter(c=>!CLASSES.includes(c))];
    order.forEach(c=>{
      const sub=list.filter(r=>r.class===c).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));
      if(sub.length===0) return;
      const sc=sub.reduce((n,r)=>n+seatsOf(r).length,0);
      html+=`<tr class="cls-head"><td colspan="7">${c} · ${sub.length}가정 ${sc}석</td></tr>`;
      sub.forEach(r=>html+=rowHtml(r));
    });
  }else if(sortMode==='time'){
    list.sort((a,b)=>new Date(a.at)-new Date(b.at)).forEach(r=>html+=rowHtml(r));
  }else{ // name (또는 특정 반 선택 시 이름순)
    list.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko')).forEach(r=>html+=rowHtml(r));
  }
  html+='</tbody></table>';
  wrap.innerHTML=html;
  wrap.querySelectorAll('.delbtn').forEach(b=>b.onclick=()=>cancelOne(b.dataset.g, b.dataset.n));
  wrap.querySelectorAll('.pick').forEach(c=>c.onchange=updatePick);
  const all=document.getElementById('checkAll');
  if(all) all.onchange=()=>{ wrap.querySelectorAll('.pick').forEach(c=>c.checked=all.checked); updatePick(); };
  updatePick();
}

function updatePick(){
  const picks=[...document.querySelectorAll('#tblWrap .pick')];
  const checked=picks.filter(c=>c.checked);
  const btn=document.getElementById('bulkDel');
  if(btn){ btn.disabled=checked.length===0; btn.textContent='🗑️ 선택 삭제 ('+checked.length+')'; }
  const all=document.getElementById('checkAll');
  if(all){ all.checked=picks.length>0 && checked.length===picks.length; all.indeterminate=checked.length>0 && checked.length<picks.length; }
}
async function cancelMany(){
  const groups=[...document.querySelectorAll('#tblWrap .pick:checked')].map(c=>c.dataset.g);
  if(groups.length===0) return;
  if(!confirm(groups.length+'건의 예약을 삭제할까요?\n선택한 좌석이 다시 풀려요. (되돌릴 수 없어요)')) return;
  const btn=document.getElementById('bulkDel'); btn.disabled=true; btn.textContent='삭제 중…';
  const results=await Promise.allSettled(groups.map(g=>supa.rpc('cancel_booking',{ p_group:g })));
  const okGroups=[]; let fail=0;
  results.forEach((res,i)=>{ if(res.status==='fulfilled' && !res.value.error) okGroups.push(groups[i]); else fail++; });
  rows=rows.filter(r=>!okGroups.includes(r.group_id));
  render();
  if(fail) alert(fail+'건은 삭제에 실패했어요. 새로고침 후 다시 시도해주세요.');
}

/* ===== 엑셀(CSV) 다운로드 ===== */
function toCSV(list){
  const esc=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['반','아이 이름','좌석수','좌석','예약시각'];
  const body=list.map(r=>[r.class, r.name, seatsOf(r).length, seatsOf(r).map(fmtSeat).join(' '), fmtTime(r.at)]);
  return '﻿'+[head,...body].map(r=>r.map(esc).join(',')).join('\r\n');
}
function downloadCSV(){
  let list=classFilter? rows.filter(r=>r.class===classFilter) : rows.slice();
  list.sort((a,b)=>(a.class||'').localeCompare(b.class||'','ko')||(a.name||'').localeCompare(b.name||'','ko'));
  if(list.length===0){ alert('다운로드할 예약이 없어요.'); return; }
  const label=classFilter||'전체';
  const csv=toCSV(list);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`뜰안애Festival_예약_${label}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

document.getElementById('loginBtn').onclick=login;
document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
document.getElementById('bulkDel').onclick=cancelMany;
document.getElementById('refresh').onclick=reload;
document.getElementById('print').onclick=()=>window.print();
document.getElementById('excel').onclick=downloadCSV;
document.getElementById('classFilter').onchange=e=>{ classFilter=e.target.value; render(); };
document.getElementById('sortMode').onchange=e=>{ sortMode=e.target.value; render(); };

(function(){ try{ const saved=sessionStorage.getItem(PW_KEY); if(saved){ document.getElementById('pw').value=saved; login(); } }catch(e){} })();
</script>
</body>
</html>
